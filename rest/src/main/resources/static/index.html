<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스프링 게시판</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
    <h1 class="mb-6 text-3xl font-bold text-slate-800">스프링 게시판</h1>

    <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <div id="loading" class="hidden border-b border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">
        로딩 중입니다...
      </div>

      <div id="error" class="hidden border-b border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>

      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-200">
          <thead class="bg-slate-50">
            <tr>
              <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">번호</th>
              <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">제목</th>
              <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">작성자</th>
              <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">작성자 이메일</th>
              <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">작성일</th>
            </tr>
          </thead>
          <tbody id="articleBody" class="divide-y divide-slate-100 bg-white"></tbody>
        </table>
      </div>
    </section>

    <nav class="mt-6 flex items-center justify-center gap-2" aria-label="페이지 이동">
      <button id="prevButton" type="button" class="rounded-md border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40">
        이전
      </button>
      <div id="pageButtons" class="flex flex-wrap justify-center gap-2"></div>
      <button id="nextButton" type="button" class="rounded-md border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40">
        다음
      </button>
    </nav>
  </main>

  <script>
    const articleBody = document.getElementById("articleBody");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const pageButtons = document.getElementById("pageButtons");

    let currentPage = 0;
    let totalPages = 0;

    // 날짜를 한국어 형식으로 보기 좋게 변환합니다.
    function formatKoreanDate(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "-";

      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    // 서버에서 받은 게시글 목록으로 표 본문을 만듭니다.
    function renderArticles(articles) {
      if (!articles || articles.length === 0) {
        articleBody.innerHTML = `
          <tr>
            <td colspan="5" class="px-4 py-8 text-center text-sm text-slate-500">게시글이 없습니다.</td>
          </tr>
        `;
        return;
      }

      articleBody.innerHTML = articles.map((article) => `
        <tr class="align-top">
          <td class="whitespace-nowrap px-4 py-4 text-sm text-slate-700">${article.id}</td>
          <td class="px-4 py-4">
            <p class="text-sm font-semibold text-slate-900">${article.title || "-"}</p>
            <p class="mt-1 text-sm text-slate-500">${article.description || ""}</p>
          </td>
          <td class="whitespace-nowrap px-4 py-4 text-sm text-slate-700">${article.name || "-"}</td>
          <td class="whitespace-nowrap px-4 py-4 text-sm text-slate-700">${article.email || "-"}</td>
          <td class="whitespace-nowrap px-4 py-4 text-sm text-slate-700">${formatKoreanDate(article.created)}</td>
        </tr>
      `).join("");
    }

    // 페이지 버튼(이전/다음/번호)을 현재 상태에 맞게 다시 그립니다.
    function renderPagination() {
      prevButton.disabled = currentPage === 0;
      nextButton.disabled = totalPages === 0 || currentPage === totalPages - 1;

      if (totalPages <= 0) {
        pageButtons.innerHTML = "";
        return;
      }

      const buttons = [];
      for (let page = 0; page < totalPages; page += 1) {
        const activeClass = page === currentPage
          ? "bg-blue-600 border-blue-600 text-white"
          : "bg-white border-slate-300 text-slate-700 hover:bg-slate-100";

        buttons.push(`
          <button type="button"
            data-page="${page}"
            class="rounded-md border px-3 py-2 text-sm font-medium transition ${activeClass}">
            ${page + 1}
          </button>
        `);
      }

      pageButtons.innerHTML = buttons.join("");

      const numberedButtons = pageButtons.querySelectorAll("button[data-page]");
      numberedButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const page = Number(button.dataset.page);
          if (!Number.isNaN(page)) {
            loadArticles(page);
          }
        });
      });
    }

    // 지정된 페이지의 데이터를 API로 다시 조회합니다.
    async function loadArticles(page) {
      currentPage = page;
      loading.classList.remove("hidden");
      error.classList.add("hidden");

      try {
        const response = await fetch(`/articles?page=${page}`);

        if (!response.ok) {
          throw new Error(`요청 실패: ${response.status}`);
        }

        const pageData = await response.json();
        totalPages = pageData.totalPages || 0;
        currentPage = pageData.number || 0;

        renderArticles(pageData.content || []);
        renderPagination();
      } catch (err) {
        articleBody.innerHTML = "";
        pageButtons.innerHTML = "";
        totalPages = 0;
        renderPagination();
        error.textContent = `게시글을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요. (${err.message})`;
        error.classList.remove("hidden");
      } finally {
        loading.classList.add("hidden");
      }
    }

    prevButton.addEventListener("click", () => {
      if (currentPage > 0) {
        loadArticles(currentPage - 1);
      }
    });

    nextButton.addEventListener("click", () => {
      if (currentPage < totalPages - 1) {
        loadArticles(currentPage + 1);
      }
    });

    loadArticles(0);
  </script>
</body>
</html>
