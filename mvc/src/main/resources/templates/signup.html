<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<form th:object="${memberForm}" th:action="@{/signup}" method="post">
    <input type="text" name="name" th:value="*{name}" placeholder="이름"/><br>
    <div th:errors="*{name}"></div>
    <input type="text" name="email" th:value="*{email}" placeholder="이메일"/><br>
    <div th:errors="*{email}"></div>
    <input type="text" name="age" th:value="*{age}" placeholder="나이"/><br>
    <div th:errors="*{age}"></div>
    <input type="password" name="password" placeholder="패스워드"/><br>
    <div th:errors="*{password}"></div>
    <input type="password" name="passwordConfirm" placeholder="패스워드"/><br>
    <div th:errors="*{passwordConfirm}"></div>
    <button>가입</button>
</form>
</body>
</html>
